apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              - 127.0.0.1:9093

    scrape_configs:
      - job_name: 'python-app'
        static_configs:
          - targets: ['172.17.0.1:8000']

      - job_name: 'node-exporter'
        static_configs:
          - targets: ['node-exporter-service:9100']

      - job_name: 'synthetic-monitoring'
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
            - http://172.17.0.1:5000/healthz
            - http://172.17.0.1:5000/readyz
            - http://172.17.0.1:5000/api/data
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter-service:9115
